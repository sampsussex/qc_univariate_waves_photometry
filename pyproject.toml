[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-univariate-waves-photometry"
version = "0.1.0"
description = "Univariate quality control plotting for WAVES photometry parquet catalogs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "WAVES QC contributors"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "matplotlib>=3.6",
  "pyarrow>=10.0",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["qc_waves_photometry*"]
